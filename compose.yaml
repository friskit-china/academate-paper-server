name: academate-paper
services:
  server:
    container_name: acade-paper
    image: academatepaper/server:local
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "${BIND_HOST:-}${BIND_HOST:+:}${WEB_PORT:-8443}:${WEB_PORT:-8443}"
      - "${BIND_HOST:-}${BIND_HOST:+:}${API_PORT:-9443}:${API_PORT:-9443}"
    environment:
      WEB_PUBLIC_ORIGIN: "https://${WEB_HOST:-127.0.0.1}:${WEB_PORT:-8443}"
      SERVER_HTTPS_API_ORIGIN: "https://${API_HOST:-${WEB_HOST:-127.0.0.1}}:${API_PORT:-9443}"
      SERVER_HTTPS_ANY_HOST: "${SERVER_HTTPS_ANY_HOST:-}"
    volumes:
      - data:/data
volumes:
  data:
    name: acade-paper-data
